<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="22" fill="#0f172a"/>
  <!-- Stylized Oulipo geometric box -->
  <rect x="22" y="22" width="56" height="56" rx="8" fill="none" stroke="url(#grad)" stroke-width="6"/>
  <!-- The forbidden 'E' with a subtle diagonal constraint line -->
  <text x="50" y="62" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" fill="#f8fafc" text-anchor="middle">O</text>
  <circle cx="50" cy="50" r="16" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 3"/>
</svg>
